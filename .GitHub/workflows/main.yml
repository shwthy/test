name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor + embedded Node plugin
        run: |
          npm install capacitor-nodejs@latest --legacy-peer-deps
          PEER=$(node -p "((require('capacitor-nodejs/package.json').peerDependencies||{})['@capacitor/core'])||'latest'")
          echo "Capacitor range: $PEER"
          npm install "@capacitor/core@$PEER" "@capacitor/cli@$PEER" "@capacitor/android@$PEER" --legacy-peer-deps
      - name: Create Android project
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $M || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          sed -i 's#</style>#    <item name="android:windowFullscreen">true</item>\n    </style>#' android/app/src/main/res/values/styles.xml
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jetpack-arena-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
